# The slow suite, outside the merge gate (policies/placement-defaults.yaml#gates): nightly and on
# demand, never on pull requests or main, so main's one required check (ci.yml `test`) stays
# the only job main runs. A red run here becomes the next fix task.
name: slow

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replica:
    # The one-command local replica (replica/replica.sh) boots and passes its smoke test on a
    # fresh kind cluster, with the tool versions AGENTS.md documents. The boot ends with the
    # lane run: the kernel, on the engine on Postgres, takes two items from admitted to merged
    # through real worker Jobs and the fake GitHub, the second with its pod deleted mid-item.
    # Then the acceptance test of tests/test_replica.py runs that lane again and reads the result.
    name: local replica (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.4
      - name: Install kind
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSLo "$HOME/.local/bin/kind" \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.25.0/kind-linux-amd64
          echo "b22ff7e5c02b8011e82cc3223d069d178b9e1543f1deb21e936d11764780a3d8  $HOME/.local/bin/kind" | sha256sum -c -
          chmod +x "$HOME/.local/bin/kind"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Boot + smoke
        run: ./replica/replica.sh up
      - name: Install
        run: pip install -e '.[dev]'
      - name: The replica admits an item and sees it merged, then again after the kernel pod is deleted mid-item
        env:
          SORTYARD_REPLICA_CLUSTER: sortyard
        run: pytest tests/test_replica.py -v -rs -k kernel_pod_is_deleted_mid_item
      - name: Diagnostics
        if: failure()
        run: |
          ./replica/replica.sh status || true
          kubectl --context kind-sortyard -n sortyard describe pods || true
          kubectl --context kind-sortyard -n sortyard logs --all-containers --prefix -l app.kubernetes.io/name=sortyard --tail=100 || true
          kubectl --context kind-sortyard -n sortyard logs --all-containers --prefix -l app.kubernetes.io/name=sortyard-replica --tail=100 || true
          kubectl --context kind-sortyard -n sortyard logs --all-containers --prefix -l app.kubernetes.io/managed-by=sortyard --tail=50 || true
          kubectl --context kind-sortyard -n sortyard get events --sort-by=.lastTimestamp | tail -60 || true
      - name: Tear down
        if: always()
        run: ./replica/replica.sh down

  engine-server:
    # The four failure tests through sortyard.engine against the engine server the chart
    # installs, on a real Postgres (docs/decisions/workflow-engine.md). replica/engine_server.py
    # runs the containers of the rendered chart with docker: the same server image, the same
    # schema Job, the same settings. With the target set no server test is skipped.
    name: engine server on Postgres (failure tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SORTYARD_ENGINE_SERVER_TARGET: 127.0.0.1:7233
      SORTYARD_REQUIRE_HELM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Install
        run: pip install -e '.[dev]'
      - name: Postgres, the schema Job and the engine server, as the chart renders them
        run: python replica/engine_server.py up
      - name: The four failure tests against the server on Postgres
        run: pytest tests/test_engine_server.py -v -rs
      - name: The schema Job is safe to run again
        run: python replica/engine_server.py schema
      - name: The four failure tests again, after the second schema run
        run: pytest tests/test_engine_server.py -v -rs
      - name: The engine's records are in Postgres
        run: python replica/engine_server.py records
      - name: Diagnostics
        if: failure()
        run: |
          docker ps --all || true
          docker logs --tail 200 sortyard-engine-engine || true
          docker logs --tail 50 sortyard-engine-postgres || true
      - name: Tear down
        if: always()
        run: python replica/engine_server.py down
