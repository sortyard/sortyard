# The repo's own checks, on every pull request and every push to main (design draft §9:
# the harness's own releases go through CI like everything else).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    # The migration + ledger tests (tests/test_migrations.py) need a real Postgres; they are
    # required here, never skipped.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SORTYARD_REQUIRE_HELM: "1"
      SORTYARD_REQUIRE_POSTGRES: "1"
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      # DEVOPS-184: temporary non-gating diagnostics before checkout.
      # Cost: four read-only requests/job; one-minute outer bound; no credential/body logging.
      # Remove after the next main-event comparison establishes REST vs Git access.
      - &checkout_access_diagnostic
        name: Diagnose native checkout access
        timeout-minutes: 1
        continue-on-error: true
        env:
          DIAGNOSTIC_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          token = os.environ.pop("DIAGNOSTIC_TOKEN")
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          opener = urllib.request.build_opener(NoRedirect)
          basic = base64.b64encode(("x-access-token:" + token).encode()).decode()
          for endpoint, url, authorization in (
              ("rest_repository", "https://api.github.com/repos/" + repo, "Bearer " + token),
              ("rest_commit", "https://api.github.com/repos/" + repo + "/commits/" + sha, "Bearer " + token),
              ("git_exact_remote", "https://github.com/" + repo + "/info/refs?service=git-upload-pack", "Basic " + basic),
              ("git_advertisement", "https://github.com/" + repo + ".git/info/refs?service=git-upload-pack", "Basic " + basic),
          ):
              record = {"endpoint": endpoint, "job": os.environ["GITHUB_JOB"], "event": os.environ["GITHUB_EVENT_NAME"]}
              request = urllib.request.Request(url, headers={"Authorization": authorization, "User-Agent": "sortyard-checkout-diagnostic", "Cache-Control": "no-cache", "Git-Protocol": "version=2"})
              try:
                  with opener.open(request, timeout=10) as response:
                      record.update(status=response.status, request_id=response.headers.get("X-GitHub-Request-Id"))
              except urllib.error.HTTPError as error:
                  record.update(status=error.code, request_id=error.headers.get("X-GitHub-Request-Id"))
              except (urllib.error.URLError, TimeoutError) as error:
                  record.update(status="network_error", error_class=type(error).__name__)
              print(json.dumps(record, sort_keys=True))
          PY
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Install
        run: |
          pip install -e '.[dev]'
          command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Generated models match the schemas
        run: python -m sortyard.models.codegen --check
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Typecheck
        run: mypy
      - name: Test
        run: pytest tests

  spec:
    # The seeded Phase 0 spec tests (spec/test_*.py).
    name: spec (Phase 0 schemas + OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - *checkout_access_diagnostic
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test
        run: pytest spec

  chart:
    name: helm chart
    runs-on: ubuntu-latest
    steps:
      - *checkout_access_diagnostic
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Lint
        run: helm lint --strict charts/sortyard
      - name: Render
        run: helm template sortyard charts/sortyard > /dev/null

  image:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - *checkout_access_diagnostic
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t ghcr.io/sortyard/sortyard:ci .
      - name: Smoke
        run: |
          docker run --rm ghcr.io/sortyard/sortyard:ci sortyard-conductor --once
          docker run --rm ghcr.io/sortyard/sortyard:ci sortyard-api --help

  replica:
    # The one-command local replica (replica/replica.sh) boots and passes its smoke test on a
    # fresh kind cluster, with the tool versions AGENTS.md documents.
    name: local replica (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - *checkout_access_diagnostic
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.4
      - name: Install kind
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSLo "$HOME/.local/bin/kind" \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.25.0/kind-linux-amd64
          echo "b22ff7e5c02b8011e82cc3223d069d178b9e1543f1deb21e936d11764780a3d8  $HOME/.local/bin/kind" | sha256sum -c -
          chmod +x "$HOME/.local/bin/kind"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Boot + smoke
        run: ./replica/replica.sh up
      - name: Diagnostics
        if: failure()
        run: |
          ./replica/replica.sh status || true
          kubectl --context kind-sortyard -n sortyard describe pods || true
          kubectl --context kind-sortyard -n sortyard logs --all-containers --prefix -l app.kubernetes.io/name=sortyard --tail=100 || true
      - name: Tear down
        if: always()
        run: ./replica/replica.sh down
