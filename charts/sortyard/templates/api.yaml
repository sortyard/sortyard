{{- $name := printf "%s-api" (include "sortyard.fullname" .) }}
{{- $selector := dict "root" . "component" "api" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "sortyard.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
  selector:
    {{- include "sortyard.selector" $selector | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "sortyard.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "sortyard.selector" $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sortyard.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: {{ include "sortyard.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sortyard-api"]
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            - name: SORTYARD_API_PORT
              value: {{ .Values.api.port | quote }}
            - name: SORTYARD_DATABASE_HOST
              value: {{ include "sortyard.postgres.host" . | quote }}
            - name: SORTYARD_DATABASE_PORT
              value: {{ include "sortyard.postgres.port" . | quote }}
            - name: SORTYARD_DATABASE_NAME
              value: {{ .Values.postgres.database | quote }}
            - name: SORTYARD_DATABASE_USER
              value: {{ .Values.postgres.auth.username | quote }}
            - name: SORTYARD_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sortyard.postgres.secretName" . }}
                  key: password
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
