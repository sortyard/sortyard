# Sortyard chart values — the one values file (design §4: values.yaml maps to the
# DeploymentConfig object; that mapping fills in as DeploymentConfig fields gain machinery).

image:
  repository: ghcr.io/sortyard/sortyard
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

api:
  replicas: 1
  port: 8080
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

postgres:
  # true: the chart runs Postgres as a StatefulSet. false: point at an existing server
  # with postgres.external.* and postgres.auth.existingSecret.
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  database: sortyard
  auth:
    username: sortyard
    # Leave empty to have the chart generate one (kept across upgrades).
    password: ""
    # Name of an existing Secret with key `password`; when set, no Secret is created.
    existingSecret: ""
  external:
    host: ""
    port: 5432
  persistence:
    size: 8Gi
    # Empty: the cluster's default StorageClass.
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# The schema migration Job: applies charts/sortyard/migrations/ with the psql of the
# postgres.image above (also when postgres.enabled=false) after every install and upgrade.
migrations:
  # How long the Job waits for Postgres to accept connections (a fresh install starts both
  # together).
  waitSeconds: 300
  backoffLimit: 3
  activeDeadlineSeconds: 900
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# The workflow engine server (Temporal; docs/decisions/workflow-engine.md): one Deployment
# running the upstream server image, one Service, and a schema Job. It stores to Postgres only:
# two databases (workflow state, and visibility) on the Postgres server above (the chart's, or
# postgres.external), or on its own external server (engine.database.host). With it enabled the
# API's SORTYARD_ENGINE_TARGET points at the Service.
engine:
  enabled: false
  # The server, pinned by version and digest. The tag is also the version the schema Job
  # records the schema as ready for; the server waits for that record. Tag and digest change
  # together: the render fails for a new tag under this digest (set the new digest, or clear
  # it), and for a toolsImage tag that is not this tag.
  image:
    repository: temporalio/server
    tag: "1.32.2"
    digest: sha256:7bf69188a6232fea14869b9cef3d94aa82a1601d99517f7e86c71f22da4e0670
    pullPolicy: IfNotPresent
  # The upstream schema tool (temporal-sql-tool) and CLI the schema Job runs. Keep it at the
  # server's version: it carries the schema that version needs.
  toolsImage:
    repository: temporalio/admin-tools
    tag: "1.32.2"
    digest: sha256:4a95866efba29d7e17ab012df5232795e8b0ad0f7d5f9d1ec4df321f7792a754
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    port: 7233
  # History shards. Fixed at the first start: the server refuses a database made with another
  # count, so changing it means a new pair of databases.
  historyShards: 16
  logLevel: info
  database:
    # Empty: the Postgres server above, with its user and its password Secret (when
    # postgres.enabled=false that Secret must be named in postgres.auth.existingSecret).
    # Set: an external server for the engine alone; username and existingSecret are then
    # required.
    host: ""
    port: 5432
    username: ""
    # Name of an existing Secret with key `password`.
    existingSecret: ""
    name: temporal
    visibilityName: temporal_visibility
    # true: the schema Job creates the two databases when they are missing (the user needs
    # CREATEDB). false: they exist already and the user owns them.
    create: true
  namespace:
    # How long the engine keeps a workflow's history after it ends. The item rows and the
    # event ledger are the lasting record, not the engine.
    retention: 7d
  # The server's dynamic configuration (key: [{value: ...}]); empty means its defaults.
  dynamicConfig: {}
  # The schema Job: creates and upgrades the engine databases with the upstream schema tool,
  # then creates the namespace. Safe to run again; it reruns whenever its inputs change.
  schema:
    # How long each step waits for Postgres, then for the server, to answer; and how long the
    # server's init container waits for this Job's record before it fails and is restarted.
    waitSeconds: 300
    backoffLimit: 3
    activeDeadlineSeconds: 900
    # A finished Job, failed or not, is removed after this long, and the next install or
    # upgrade of the release makes it again (running it again is safe). A failed Job therefore
    # never has to be deleted by hand.
    ttlSecondsAfterFinished: 600
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 256Mi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# The kernel service (company/HARNESS-V3.md section 3.1; `sortyard-kernel`): the engine worker
# and the observer loop that take an item from admitted to merged. It needs engine.enabled.
# With it enabled the API mounts the lane capability files too, so it can admit items.
# Every credential it uses is a Secret reference, and each one is required: the render fails
# when one is missing. Nothing here is a credential's value.
kernel:
  enabled: false
  # Seconds between two passes of the observer loop over the open stays.
  observerIntervalSeconds: 15
  # How long the pod waits at start for the engine to answer before it fails and is restarted.
  engineWaitSeconds: 300
  # The lane capability files, by file name without `.toml`: each value is the file's text
  # (the format: src/sortyard/kernel/lane_example.toml). At least one is required. They are
  # mounted as files into the kernel and the API.
  lanes: {}
  # The decision policy file's text (the format: src/sortyard/kernel/decision_policy.toml).
  # Empty: the policy shipped in the image, which has no rules.
  decisionPolicy: ""
  # How workers run in this deployment; rendered into the worker configuration file.
  worker:
    # The agent command (an argv) for each kind of work. All three are required. The worker
    # image of every lane must contain the command (README, "Worker image").
    agents:
      build: []
      fix: []
      review: []
    # The clone URL of a repository; `{repository}` is replaced by owner/name.
    # Empty: https://github.com/{repository}.git
    gitUrl: ""
    # The entry point the worker containers run. Empty: ["sortyard-worker"].
    command: []
    # Seconds. 0 leaves the service's default: the deadline of a Job whose state has no limit
    # (7200), how long a finished Job is kept (86400), and how old a running Job's GitHub token
    # may get before it is replaced (1800).
    deadlineSeconds: 0
    ttlSeconds: 0
    tokenAgeSeconds: 0
    # Lane secret name -> the Secret and key that hold it in the worker namespace:
    #   MODEL_API_KEY: {secret: models, key: api-key}
    # A name not listed is read from the Secret named after it (lower case, dashes), key = name.
    secrets: {}
    # Lane service name -> the URL its preflight probe calls.
    services: {}
  github:
    # The GitHub App the lanes' tokens are minted from. Required.
    appId: ""
    # Required: the name of an existing Secret holding the App's private key (PEM).
    appKeySecret: ""
    appKeySecretKey: private-key.pem
    # Empty: https://api.github.com
    apiUrl: ""
  workers:
    # The namespace worker Jobs run in. Empty: the release namespace.
    namespace: ""
    # true: the Jobs run in the cluster of this release. The kernel uses its own service
    # account, and a Role in the worker namespace grants it what the jobs port calls and no
    # more. false: the Jobs run in another cluster, reached through clusterSecret; no Role is
    # rendered and the pod gets no service-account token.
    sameCluster: true
    # Required when sameCluster is false: the name of an existing Secret with the keys
    # `server` (the URL of that cluster's API server), `token` (a bearer token allowed what
    # the Role below grants, in the worker namespace) and `ca.crt` (the CA of the server's
    # certificate).
    clusterSecret: ""
    # false: the server's certificate is verified against the image's trust store, and the
    # Secret needs no `ca.crt`.
    clusterCA: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# The shadow conductor (design §8 Phase 1): `sortyard-conductor --shadow` reads the production
# conductor's input path READ-ONLY and records what it would claim/refuse in the DecisionLog.
# Off by default; it needs the input path configured. Runbook: README "Shadow conductor".
shadow:
  enabled: false
  # Seconds between passes; drive.py's cadence is ~5 minutes.
  interval: 300
  # Workspace the DecisionLog entries are scoped to (created if missing).
  workspace: ws-shadow
  # snapshot: a pass feed {"passes": [board view, ...]} retaining unread passes, a directory
  #   of board views (one per pass), or a single board view (file or http(s) URL; see
  #   sortyard.shadow.sources). Only a feed/directory records every production pass.
  # plane: the board from Plane's REST API, joined with the lane registry below; every new
  #   pass in the production pass log is replayed from the inputs it retained.
  source: snapshot
  snapshot: ""
  # Optional task_ready gating output (file or http(s) URL).
  gating: ""
  plane:
    url: ""
    workspace: ""
    # Plane project ids to read.
    projects: []
    # Name of a Secret with key `api-key`: a READ-ONLY Plane API key.
    apiKeySecret: ""
    # The production conductor's pass log (file or http(s) URL), retaining each pass's inputs:
    # {"passes": [{"production_pass_id": ..., "inputs": {"issues": {<project id>: [...]}, "gating": {...}}}]}.
    passes: ""
  # The lane registry (the conductor's products.json), mounted read-only from a ConfigMap.
  lanes:
    configMap: ""
    key: products.json
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
