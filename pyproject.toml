[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sortyard"
version = "0.1.0"
description = "Sortyard: a source-available delivery harness (conductor, control plane, task manager)."
readme = "README.md"
license = "FSL-1.1-ALv2"
license-files = ["LICENSE.md", "LICENSE-APACHE", "NOTICE"]
requires-python = ">=3.11"
# psycopg: the services' Postgres driver (the shadow conductor writes the DecisionLog).
# jsonschema: the API validates every document against its full §3 JSON Schema before storing.
# temporalio: the durable workflow engine SDK, imported only by src/sortyard/engine
# (docs/decisions/workflow-engine.md).
# cryptography: signs the GitHub App token (RS256), imported only by src/sortyard/lane/github.py
# (DECISIONS.md SY-DEC-008).
dependencies = ["cryptography>=42", "jsonschema>=4.21", "psycopg[binary]>=3.1", "temporalio>=1.36,<2"]

[project.optional-dependencies]
dev = [
    # Licence acceptance builds an sdist and a wheel through the PEP 517 frontend.
    "build>=1.2",
    # Provision the acceptance build backend before running tests, without isolation.
    "setuptools==80.9.0",
    "mypy>=1.10",
    "pytest>=8",
    "pyyaml>=6",
    "ruff>=0.5",
    "types-PyYAML",
]

# The six §4 services, one entry point each (SY-DEC-001).
[project.scripts]
sortyard-api = "sortyard.services.api:main"
sortyard-conductor = "sortyard.services.conductor:main"
sortyard-context-assembler = "sortyard.services.context_assembler:main"
sortyard-eval-runner = "sortyard.services.eval_runner:main"
sortyard-sensor-runner = "sortyard.services.sensor_runner:main"
sortyard-integrator = "sortyard.services.integrator:main"
# What a worker Job runs (SY-V3-WORKER-LAUNCHER); not one of the six services.
sortyard-worker = "sortyard.services.worker:main"
# The kernel service (SY-V3-LANE-RUNTIME): the engine worker and the observer loop.
sortyard-kernel = "sortyard.services.kernel:main"
# The red-main observer (SY-V3-RED-MAIN-OWNED): a red default branch of a lane repository is
# answered by one triage item admitted through the API.
sortyard-red-main = "sortyard.services.red_main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sortyard = ["py.typed", "models/schemas.json", "kernel/item_states.toml", "kernel/lane_example.toml", "kernel/decision_policy.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# _generated.py is generator output: checked by mypy and by the drift test, not hand-styled.
extend-exclude = ["spec", "src/sortyard/models/_generated.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
# charts/sortyard/kernel: the script of the kernel pod's init container.
files = ["src", "tests", "replica", "charts/sortyard/kernel"]
